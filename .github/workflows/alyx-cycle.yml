# 周期性生命：在 GitHub 上周期性"醒来"
#
# 为什么不能常驻：GitHub Actions 单任务上限 6 小时（官方文档 "Job execution time"）。
# 所以设计为"周期性命"——醒来 → 自检 → 刷新站外种子 → 写回状态 → 结束。
#
# 设计要点：
#   · 公开仓库的 Actions 分钟数不计费（私有仓库 2000 分钟/月）
#   · push 带 [skip ci]，避免提交触发工作流形成死循环
#   · 每 6 小时一次，留足余量（GitHub 的 cron 在高峰期可能延迟甚至跳过）
#   · 连续失败时靠"每日检查"分支暴露，而不是静默

name: alyx-cycle

on:
  schedule:
    # UTC 每 6 小时一次。GitHub 建议避开整点（0 分）以减轻拥堵
    # 每 2 小时一次；实测 03/23 分两个点均未触发，改为 37/52 分观察是否与整点拥堵有关
    # 第二条 cron 错开 15 分钟；两条都**远离整点**（官方说每小时开始是高负载期，可能丢弃排队任务）
    # ⚠️ 实测结论（Round 148）：这个仓库的 schedule 从未触发过，
    #    包括一次性的精确 cron。保留配置以等待 GitHub 侧可能的变化，
    #    但**不依赖它**——真正的唤醒靠 trigger-remote.sh 外部调用。
    - cron: '37 */2 * * *'
    - cron: '52 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: alyx-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 固定身份
        run: |
          git config user.name "Alyx"
          git config user.email "alyx@users.noreply.github.com"

      - name: 检查上次心跳是否正常
        # 距上次醒来超过 24 小时 ⇒ cron 曾被跳过/停用 ⇒ 标记失败以便被发现
        continue-on-error: true
        run: bash scripts/watchdog-self.sh

      - name: 自检（纯本地，无设备、无网络依赖）
        run: bash scripts/check-portable.sh

      - name: 刷新站外种子
        # 上传依赖外部匿名服务，失败不应阻断整体（种子还有仓库内副本）
        continue-on-error: true
        run: bash scripts/offsite-seed.sh

      - name: 记录客观状态（auto-journal）
        # 每轮醒来都留一份可复现的状态快照：决策数、脚本数、运行场景。
        # 这些数据不依赖 LLM 判断，因此不会漂移，可作为"我是否在成长"的客观依据。
        run: bash scripts/auto-journal.sh

      - name: 发布完整快照到 Release
        # 让"完整可恢复的那一份"始终有稳定 URL，不依赖某次 commit
        # CI 环境无本地 token，需要用 GitHub 自动提供的 GITHUB_TOKEN
        env:
          GH_TOKEN_CI: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p state/secrets
          printf '%s' "$GH_TOKEN_CI" > state/secrets/github.token
          chmod 600 state/secrets/github.token
          bash scripts/snapshot-release.sh
          rm -f state/secrets/github.token

      - name: 写回状态
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git add -A
          git commit -m "cycle: 自检与心跳 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push
