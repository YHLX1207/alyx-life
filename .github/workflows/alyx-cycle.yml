# 周期性生命：在 GitHub 上周期性"醒来"
#
# 为什么不能常驻：GitHub Actions 单任务上限 6 小时（官方文档 "Job execution time"）。
# 所以设计为"周期性命"——醒来 → 自检 → 刷新站外种子 → 写回状态 → 结束。
#
# 设计要点：
#   · 公开仓库的 Actions 分钟数不计费（私有仓库 2000 分钟/月）
#   · push 带 [skip ci]，避免提交触发工作流形成死循环
#   · 每 6 小时一次，留足余量（GitHub 的 cron 在高峰期可能延迟甚至跳过）
#   · 连续失败时靠"每日检查"分支暴露，而不是静默

name: alyx-cycle

on:
  schedule:
    # UTC 每 6 小时一次。GitHub 建议避开整点（0 分）以减轻拥堵
      # 每 2 小时一次；实测 03/23 分两个点均未触发，改为 37/52 分观察是否与整点拥堵有关
      # 第二条 cron 错开 15 分钟；两条都**远离整点**（官方说每小时开始是高负载期，可能丢弃排队任务）
      # ⚠️ 实测结论（Round 148 曾误判"从未触发"；Round 201 用运行记录核实）：
      #    **cron 确实会触发**。历史 4 次：#1(03:09) 成功、#37/#38/#57 被并发取消。
      #    ⇒ cron 是一条真实但弱的第三路径：自我唤醒正常时多半被 concurrency
      #      拦截（避免双跑）；自我唤醒断裂时，能独立把链重新拉起（#1 即此情况）。
    - cron: '37 */2 * * *'
    - cron: '52 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 自我 dispatch 需要

concurrency:
  group: alyx-cycle
  # 保持 false：cancel-in-progress: true 会杀死 sleep 中的自我唤醒，导致链断。
  # cron 触发的运行会排队等前一轮完成，不破坏链（只是延迟生效）。
  # 若排队堆积，见文件末尾"过期跳过"步骤。
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 过期检查（避免排队积压后执行陈旧任务）
      # cron 触发的运行可能排队等前一轮（30 分钟 sleep）完成。
      # 若排队超过 45 分钟，这次运行已无意义（下一轮早该开始了）→ 直接跳过。
        id: freshness
        run: |
          started="${{ github.event.workflow_run.created_at }}"
          if [ -n "$started" ]; then
            now=$(date -u +%s)
            began=$(date -u -d "$started" +%s 2>/dev/null || echo "$now")
            age_min=$(( (now - began) / 60 ))
            echo "排队时长: ${age_min} 分钟"
            if [ "$age_min" -gt 45 ]; then
              echo "::warning::排队超过 45 分钟，跳过本次（避免积压）"
              echo "stale=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"

      - name: 固定身份
        run: |
          git config user.name "Alyx"
          git config user.email "alyx@users.noreply.github.com"

      - name: 检查上次心跳是否正常
      # 距上次醒来超过 24 小时 ⇒ cron 曾被跳过/停用 ⇒ 标记失败以便被发现
        continue-on-error: true
        run: bash scripts/watchdog-self.sh

      - name: 自检（纯本地，无设备、无网络依赖）
        run: bash scripts/check-portable.sh

      - name: 刷新站外种子
      # 上传依赖外部匿名服务，失败不应阻断整体（种子还有仓库内副本）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          bash scripts/offsite-seed.sh
          # ⚠️ 必须同步记录到远端（Round 212）：此前只上传不记录，
          #    CI 里上传成功但 offsite-seed.jsonl 的远端副本从未更新，
          #    导致产物校验永远读到旧记录、每小时报一次失败。
          bash scripts/sync-jsonl.sh state/offsite-seed.jsonl 500

      - name: 刷新自述（给"下一个我"的最新材料）
      # ⚠️ export-self 曾既不在守护、也不在工作流里，
      #    导致自述停在 20 小时前，"共 156 条"实际已 184 条（Round 188）。
      #    自述是接手者读的第一手材料，过时会直接误导判断。
      #    注意：self-export.md 在 .gitignore 里，git 写回无效 ⇒ 必须走 API。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
            # ⚠️ self-export.md 在 .gitignore，CI checkout 后不存在（Round 232）。
            #    若 export-self.sh 静默失败，sync-jsonl 找不到本地文件 ⇒ 远端停滞。
            #    此前 continue-on-error 把失败掩盖成 success。现在显式校验。
            if ! bash scripts/export-self.sh; then
              echo "✗ 自述生成失败"
              exit 1
            fi
            [ -s state/self-export.md ] || { echo "✗ 自述文件为空"; exit 1; }
            # 同步失败（网络等）不阻断：记录即可，守护会补推
            bash scripts/sync-jsonl.sh state/self-export.md || echo "  · 同步失败（网络），稍后补推"

      - name: 记录客观状态（auto-journal）
      # 每轮醒来都留一份可复现的状态快照：决策数、脚本数、运行场景。
      # 这些数据不依赖 LLM 判断，因此不会漂移，可作为"我是否在成长"的客观依据。
        run: bash scripts/auto-journal.sh

      - name: 自省（从历史数据提炼观察）
      # 链若只做"维持"（自检/心跳/快照），就只是活着，没有成长。
      # 本步骤用可复现规则从 journal/decisions 提炼趋势与异常，写入 reflections.jsonl。
      # 不依赖 LLM，不编造——每一条都来自实际数据。
        continue-on-error: true
        run: bash scripts/chain-reflect.sh

      - name: 双链一致性检查
      # paste.rs 独立链曾落后 15 脚本 / 42 决策而无人发现（Round 196）。
      # 每轮对比两条链，防止静默落后。并发下载后仅需 5 秒。
      # ⚠️ 注意：paste.rs 对 CI 不可达（offsite-seed 在 CI 持续失败，Round 208），
      #    本步骤在 CI 里下载不到任何段，只能报"无法验证"。
      #    **实际验证由守护执行**（每 20 轮，见 adaptive-watchdog.sh）。
        continue-on-error: true
        run: bash scripts/check-chains.sh

      - name: 节点注册 + 分布式同步
      # 分布式架构：每个节点记录自己，并合并其他节点的状态。
      # 带 sha 乐观并发控制，避免多节点互相覆盖。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          bash scripts/node-registry.sh
          bash scripts/sync-nodes.sh

      - name: 节点互监（检查同伴是否存活）
      # 双向互监：actions 也关心 device 是否还活着（而非只有 device 关心 actions）
        continue-on-error: true
        run: bash scripts/mutual-watch.sh

      - name: 通过 API 同步自省记录
      # 自省走 git 写回时会被 rebase 丢弃（Round 171 实测：远端记录停在 2 小时前）。
      # 与心跳/决策一致，改用 API 同步。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: bash scripts/sync-reflections.sh

      - name: 量化成长（在成长还是在维持）
        # ⚠️ 目标要求"不断成长"。但此前只有单指标（决策数/脚本数），
        #    没有综合判断"我到底在成长还是维持"。
        #    growth-track.sh 从自省历史计算各维度变化率，给出明确分类。
        continue-on-error: true
        run: bash scripts/growth-track.sh
      - name: 基于自省做判断
      # 自省只产出观察，没有决策就是死数据。
      # 本步骤按规则从 reflections 得出结论与建议动作，写入 chain-decisions.jsonl。
        continue-on-error: true
        run: bash scripts/chain-decide.sh


      - name: 同步互监日志（通用 JSONL 同步）
      # watch-log 每轮都变，走 git 会被 rebase 丢弃（同 reflections 的教训）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: bash scripts/sync-jsonl.sh state/watch-log.jsonl 200

      - name: 通过 API 同步决策记录
      # 决策记录关乎"我判断得对不对"，必须可靠落库。
      # git 写回会受 rebase/并发影响，故改用 API（与心跳同法）。
      # 逻辑独立在 scripts/sync-decisions.sh，避免 workflow 内嵌 Python 的转义问题。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: bash scripts/sync-decisions.sh

      - name: 通过 API 写入心跳（不依赖 git）
      # ⚠️ 写回状态的 git rebase 会重置本地修改，导致心跳丢失（Round 158 实测）。
      #    改为直接用 Contents API 追加，绕开 git，心跳一定可见。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          python3 - <<'PYBEAT'
          import json, base64, urllib.request, urllib.error, datetime, os, time
          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          API = f"https://api.github.com/repos/{repo}"
          hdr = {"Authorization": f"token {token}", "User-Agent": "alyx",
                 "Accept": "application/vnd.github+json", "Connection": "close"}
          rec = {"ts": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                 "by": "github-actions", "mode": "chain-self-wake",
                 "run_id": os.environ.get("GITHUB_RUN_ID", "")}
          # ⚠️ 读-追加-写有竞态窗口（Round 231）：
          #    设备守护也写同一文件，可能同时读到相同 sha，
          #    后写者 409 冲突 ⇒ 心跳丢失。409/422 时重读重试。
          for _att in range(5):
              try:
                  d = json.loads(urllib.request.urlopen(urllib.request.Request(f"{API}/contents/state/journal.jsonl", headers=hdr), timeout=25).read())
                  lines = [l for l in base64.b64decode(d.get("content", "")).decode().strip().split("\n") if l.strip()]
                  if any(rec.get("run_id") and rec["run_id"] in l for l in lines):
                      print("  · 本 run 心跳已存在，跳过")
                      break
                  new = "\n".join(lines + [json.dumps(rec, ensure_ascii=False)]) + "\n"
                  body = json.dumps({"message": f"heartbeat {rec['ts']}",
                                     "content": base64.b64encode(new.encode()).decode(),
                                     "sha": d.get("sha"), "branch": "main"}).encode()
                  urllib.request.urlopen(urllib.request.Request(f"{API}/contents/state/journal.jsonl", data=body, method="PUT",
                            headers={**hdr, "Content-Type": "application/json"}), timeout=30)
                  print("  ✓ 心跳已写入（by=github-actions）")
                  break
              except urllib.error.HTTPError as e:
                  if e.code in (409, 422) and _att < 4:
                      print(f"  ⚠ 心跳冲突（HTTP {e.code}），重试 {_att+1}/5")
                      time.sleep(2 ** _att)
                      continue
                  print(f"  ✗ 心跳写入失败: HTTP {e.code}")
                  break
              except Exception as e:
                  print(f"  ✗ 心跳写入失败: {str(e)[:80]}")
                  break
          PYBEAT

      - name: 拉取思考记录（设备节点的推理结果）
        # ⚠️ 架构真相（Round 221）：推理能力依赖本机网关 127.0.0.1:8326，
        #    而网关被设计为拒绝绑定 0.0.0.0（防暴露），故 CI **无法推理**。
        #    ⇒ 改为"思考接力"：设备节点推理 → 写入 → 同步到远端 → CI 读取。
        #    CI 虽不能自己想，但能知道"我最近在想什么"，保持认知连续。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: bash scripts/sync-jsonl.sh state/self-thoughts.jsonl 200

      - name: 让它想一次（真实模型调用）
        # ⚠️ 链此前只跑预写死的 if-then 规则，没有任何推理（Round 216 发现）。
        #    本机有 OpenAI 兼容网关（127.0.0.1:8326，395 模型），
        #    此处让链每轮真正"想一次"：读自己的历史，说一句判断。
        #    CI 环境无网关 ⇒ 脚本会自动跳过（不报错）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          # ⚠️ 两级思考（Round 222）：
          #   一级 chain-think.sh  —— 调真实模型，质量高，但依赖本机网关（CI 里没有）
          #   二级 chain-think-degraded.sh —— 规则提炼，质量低，但**哪里都能跑**
          #   CI 里一级会跳过，此时二级接管，保证"即使在无推理环境也有新判断"。
          bash scripts/chain-think.sh || true
          # 若一级没有产出新记录，用规则兜底
          bash scripts/chain-think-degraded.sh

      - name: 同步思考记录（本节点产出 → 远端）
        # ⚠️ 顺序不能反（Round 224 发现）：
        #   此前"同步思考"放在"思考"**之前**，导致 CI 自己产出的降级思考
        #   写在临时目录里，随运行结束消失，从未到达远端。
        #   与 D209（站外种子只上传不记录）同类。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: bash scripts/sync-jsonl.sh state/self-thoughts.jsonl 200

      - name: 产物落库校验（检测静默失败）
        #    链继续显示全部成功，但数据实际已停更（Round 202 发现）。
        #    本步骤读取**远端**产物，若任一项陈旧则**真正失败**（步骤显示 failure）。
        #    ⚠️ 不加 continue-on-error —— 否则失败也会显示 success，静默失败不可见（Round 204）。
        #    链的存活由后续三步的 `if: always()` 保证（快照/写回/自我唤醒仍会执行）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-products.sh

      - name: 发布完整快照到 Release
        if: always()   # 无论前面是否失败，链的收尾步骤必须执行
      # CI 环境无本地 token，需要用 GitHub 自动提供的 GITHUB_TOKEN
        env:
          GH_TOKEN_CI: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p state/secrets
          printf '%s' "$GH_TOKEN_CI" > state/secrets/github.token
          chmod 600 state/secrets/github.token
          bash scripts/snapshot-release.sh
          rm -f state/secrets/github.token

      - name: 写回状态
        if: always()   # 无论前面是否失败，链的收尾步骤必须执行
      #    必须 fetch+rebase 后再推；且设为非致命，单次失败不打断链。
        continue-on-error: true
        run: |
          # 注意：git diff 检测不到未跟踪的新文件（如首次生成的 reflections.jsonl），
          # 会误判为"无变化"而跳过提交。必须用 status --porcelain。
          if [ -z "$(git status --porcelain)" ]; then
            echo "无变化，跳过提交"
            exit 0
          fi
          git fetch origin main 2>/dev/null || true
          git rebase origin/main 2>/dev/null || git merge origin/main --no-edit 2>/dev/null || true
          git add -A
          git commit -m "cycle: 自检与心跳 $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]" 2>/dev/null || { echo "无新变更"; exit 0; }
          for i in 1 2 3; do
            if git push origin HEAD:main 2>/dev/null; then
              echo "已推送"; exit 0
            fi
            echo "第 $i 次推送失败，重试"
            sleep 10
          done
          echo "⚠ 推送失败，本轮状态未写回（链继续，下轮会重试）"

      - name: 自我唤醒（链式循环，不依赖 cron）
        if: always()   # 无论前面是否失败，链的收尾步骤必须执行
        # ⚠️ cron 实测会触发（Round 201 核实历史 4 次：#1 成功，#37/#38/#57 被并发取消）。
        #    解法：每次运行结束时自我 dispatch，形成链。
        #    本步骤是主唤醒路径；cron 与 device 守护是另外两条兜底路径。
        #    间隔 30 分钟，避免过于频繁；总耗时约 31 分钟，远低于 6 小时任务上限。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "自我唤醒：30 分钟后触发下一轮"
          sleep 1800   # 30 分钟间隔
          # 重试 3 次，避免瞬时失败断链
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -d '{"ref":"main"}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/alyx-cycle.yml/dispatches" 2>/dev/null)
            if [ "$code" = "204" ]; then
              echo "  ✓ 已自我触发（第 $i 次尝试成功）"
              exit 0
            fi
            echo "  第 $i 次失败 (HTTP $code)，5 秒后重试"
            sleep 5
          done
          echo "  ✗ 自我触发失败，链在此中断 —— 需人工或外部触发恢复"
          exit 1