name: alyx-sentinel

# 哨兵节点（Round 9）
#
# 部署在灾备仓库 alyx-mirror，只读监控主仓库，不写主仓库任何状态。
#
# 主仓库 alyx-life 若消失/被封/被删，本仓库可接管运行。
# 本工作流每 30 分钟检查主仓库心跳，超过 90 分钟未更新则报警。
#
# 设计约束：
#   · 平时绝不写主仓库（避免状态冲突）
#   · 只写本仓库的 sentinel.jsonl

"on":
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: alyx-sentinel
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: check-primary
        id: check
        env:
          TK: ${{ secrets.GITHUB_TOKEN }}
          PRIMARY: YHLX1207/alyx-life
        run: bash scripts/sentinel-check.sh

      - name: record-heartbeat
        env:
          TK: ${{ secrets.GITHUB_TOKEN }}
          ALIVE: ${{ steps.check.outputs.alive }}
        run: bash scripts/sentinel-record.sh

      - name: alert-if-dead
        if: steps.check.outputs.alive == 'false'
        run: |
          echo "::error::主仓库疑似死亡（${{ steps.check.outputs.reason }}）"
          echo "本仓库已包含完整代码，可接管运行：手动触发 alyx-cycle"
